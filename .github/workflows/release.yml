name: Release APK

on:
  push:
    tags: [ "v*" ]

jobs:
  release:
    name: Build and Release
    if: github.repository_owner == 'hxreborn'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write sign info
        run: |
          if [ ! -z "${{ secrets.RELEASE_KEYSTORE }}" ]; then
            echo storePassword='${{ secrets.RELEASE_STORE_PASSWORD }}' >> keystore.properties
            echo keyAlias='${{ secrets.RELEASE_KEY_ALIAS }}' >> keystore.properties
            echo keyPassword='${{ secrets.RELEASE_KEY_PASSWORD }}' >> keystore.properties
            echo storeFile='${{ github.workspace }}/key.jks' >> keystore.properties
            echo ${{ secrets.RELEASE_KEYSTORE }} | base64 --decode > ${{ github.workspace }}/key.jks
          fi

      - name: Get application version name
        run: echo "VERSION_NAME=$(${{ github.workspace }}/gradlew -q printVersionName)" >> $GITHUB_ENV

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
