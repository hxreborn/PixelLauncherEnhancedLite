name: Build Debug APK

on:
  push:
    branches: [ "ple-lite" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    if: github.repository_owner == 'hxreborn'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write sign info
        run: |
          if [ ! -z "${{ secrets.RELEASE_KEYSTORE }}" ]; then
            echo storePassword='${{ secrets.RELEASE_STORE_PASSWORD }}' >> keystore.properties
            echo keyAlias='${{ secrets.RELEASE_KEY_ALIAS }}' >> keystore.properties
            echo keyPassword='${{ secrets.RELEASE_KEY_PASSWORD }}' >> keystore.properties
            echo storeFile='${{ github.workspace }}/key.jks' >> keystore.properties
            echo ${{ secrets.RELEASE_KEYSTORE }} | base64 --decode > ${{ github.workspace }}/key.jks
          fi

      - name: Get application version name
        run: echo "VERSION_NAME=$(${{ github.workspace }}/gradlew -q printVersionName)" >> $GITHUB_ENV

      - name: Set application version name
        uses: chkfung/android-version-actions@v1.2.3
        with:
          gradlePath: app/build.gradle.kts
          versionName: "${{ env.VERSION_NAME }} Dev${{ github.run_number }}"

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "PLELite v${{ env.VERSION_NAME }} Dev${{ github.run_number }}"
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
